<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <meta name="description" content="" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" />
    <meta property="og:type" content="" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="" />
    <meta name="twitter:card" content="" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="assets/js/app.js"></script>
    <script defer src="assets/js/cookies.js"></script>
  </head>
  <body>
    <script type="application/ld+json" id="structured-data"></script>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" data-site-brand></a>
        <nav class="main-nav" aria-label="Navegación principal">
          <a href="index.html">Inicio</a>
        </nav>
      </div>
    </header>

    <main>
      <div id="site-state" class="state container" role="status" aria-live="polite" hidden></div>

      <div id="home-view">
        <section class="hero">
          <div class="container hero-grid">
            <div>
              <p class="eyebrow" data-site-hero-eyebrow></p>
              <h1 data-site-hero-title></h1>
              <p class="lead" data-site-hero-text></p>
              <div class="cta-row">
                <a class="button button-primary" href="categoria.html" data-site-hero-primary-cta></a>
                <a
                  class="button button-secondary"
                  href="#featured"
                  data-site-hero-secondary-cta
                  data-site-hero-featured-cta
                ></a>
              </div>
            </div>
            <div class="hero-card">
              <div class="hero-card-inner">
                <span class="card-pill" data-site-hero-card-pill></span>
                <h2 data-site-hero-card-title></h2>
                <ul data-site-hero-card-points></ul>
              </div>
            </div>
          </div>
        </section>

        <section id="featured" class="section">
          <div class="container">
            <div class="section-head">
              <p class="eyebrow" data-site-featured-eyebrow></p>
              <h2 data-site-featured-title></h2>
            </div>
            <div
              id="featured-state"
              class="state"
              data-state-for="featured-products"
              role="status"
              aria-live="polite"
              hidden
            ></div>
            <div id="featured-products" class="product-grid"></div>
          </div>
        </section>
      </div>

      <div id="category-view" class="legal-body" hidden>
        <section id="category-header" class="container category-layout" hidden>
          <div class="category-feature">
            <img id="category-image" alt="" loading="lazy" />
          </div>
          <div class="category-copy">
            <p class="eyebrow" id="category-name"></p>
            <h1 id="category-title"></h1>
            <p id="category-description"></p>
          </div>
        </section>

        <!-- T6 (R1, R9): misma zona de texto que en categoria.html, dentro de la vista compartida.
             Nace oculta y vacía y solo se llena con texto de categoría válido (R2, R3). -->
        <section id="category-text" class="section container" hidden></section>

        <section class="section">
          <div class="container">
            <div class="section-head">
              <p class="eyebrow" data-site-products-eyebrow></p>
              <h2 data-site-products-title></h2>
            </div>
            <div
              id="category-state"
              class="state"
              data-state-for="category-products"
              role="status"
              aria-live="polite"
              hidden
            ></div>
            <div id="category-products" class="product-grid"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p data-site-footer-line></p>
        <div class="footer-links">
          <a href="avisos-legales.html">Avisos legales</a>
          <a href="politica-privacidad.html">Privacidad</a>
          <a href="politica-cookies.html">Cookies</a>
          <a href="#" data-open-preferences>Preferencias</a>
          <a data-site-contact-link></a>
        </div>
      </div>
    </footer>

    <div id="cookie-banner" class="cookie-banner hidden" aria-live="polite">
      <div class="container cookie-inner">
        <p data-site-cookie-text></p>
        <div class="cookie-actions">
          <button
            type="button"
            class="button button-secondary"
            data-cookie-action="reject"
            data-site-cookie-reject
          ></button>
          <button
            type="button"
            class="button button-primary"
            data-cookie-action="accept"
            data-site-cookie-accept
          ></button>
        </div>
      </div>
    </div>
  </body>
</html>
